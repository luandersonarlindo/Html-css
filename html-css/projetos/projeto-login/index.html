<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="estilos/style.css">
    <link rel="stylesheet" href="estilos/media-query.css">
</head>

<body>
    <main>
        <section id="login">
            <div id="imagem"></div>
            <div id="formulario">
                <h1>Bem-vindo</h1>
                <p>Acesse sua conta e continue sua jornada conosco.</p>
                <form action="" method="post" id="loginForm">
                    <div class="campo">
                        <input type="email" name="login" id="ilogin" placeholder="E-mail" required autocomplete="email"
                            maxlength="50">
                        <label for="ilogin">Login</label>
                    </div>
                    <div class="campo">
                        <input type="password" name="senha" id="isenha" placeholder="Senha" required
                            autocomplete="current-password" minlength="6" maxlength="50">
                        <label for="isenha">Senha</label>
                    </div>
                    <input type="submit" value="Entrar">
                    <a href="#" class="botao">Esqueceu sua senha?</a>
                </form>
            </div>
        </section>
    </main>
    <script src="login.js"></script>
</body>

</html>
